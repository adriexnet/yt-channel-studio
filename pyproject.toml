[project]
name = "yt-channel-studio"
version = "2.1.0"
description = "Produce, assemble and publish short vertical videos (Reels, Shorts, TikTok) from Google Colab"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools]
packages = ["studio", "studio.tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: opens the Control Center in a real Chromium (needs Playwright)",
]
